[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskcheck"
version = "0.1.0"
description = "COMP4423 paired desk-image change analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
vision = ["ultralytics>=8,<9", "Pillow>=10,<13"]
ui = ["streamlit>=1.67,<2"]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["references/a2_reuse/original"]
force-exclude = true
